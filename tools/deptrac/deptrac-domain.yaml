parameters:
  paths:
    - ../../code/src
  exclude_files:
    - '#.*test.*#'
    - '#vendor#'
  layers:
    - name: HealthcheckClasses
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Healthcheck/.*
          must_not:
            - type: interface
              value: .*Interface$
    - name: CoreDomainClasses
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/CoreDomain/.*
          must_not:
            - type: interface
              value: .*Interface$
    - name: HealthcheckInterfaces
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Healthcheck/.*
            - type: interface
              value: .*Interface$
    - name: CoreDomainInterfaces
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/CoreDomain/.*
            - type: interface
              value: .*Interface$

  ruleset:
    HealthcheckClasses:
      - HealthcheckInterfaces # Can use/implement own domain interfaces
      - CoreDomainInterfaces  # Can use other domain interfaces
    CoreDomainClasses:
      - CoreDomainInterfaces  # Can use/implement own domain interfaces
      - HealthcheckInterfaces # Can use other domain interfaces
    HealthcheckInterfaces: ~
    CoreDomainInterfaces: ~